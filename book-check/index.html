<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f1">
<title>Book Check</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #f5f5f1; --card: #ffffff; --ink: #1c2622; --muted: #75807a; --line: #e6e8e2;
    --accent: #1f4d3a; --accent-ink: #ffffff;
    --ok: #2f8a55; --ok-bg: #e8f4ec; --warn: #a86a12; --warn-bg: #fbf1df;
    --bad: #b8392e; --bad-bg: #f9e7e5; --plain-bg: #f0f1ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121614; --card: #1b201d; --ink: #e8ece9; --muted: #8f9a94; --line: #2a302c;
      --accent: #a9d3b5; --accent-ink: #10231a;
      --ok: #7fcf99; --ok-bg: #18301f; --warn: #e5b45e; --warn-bg: #33281a;
      --bad: #f08a80; --bad-bg: #3a1f1c; --plain-bg: #232925;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
  [hidden] { display: none !important; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: -.3px; }
  .who { font-size: 12px; color: var(--muted); }
  .who button { border: 0; background: none; color: var(--muted); text-decoration: underline; font: inherit; padding: 0 0 0 6px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  label.small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  select, input { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; appearance: none; -webkit-appearance: none; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  button.primary { width: 100%; font: inherit; font-weight: 600; border: 0; border-radius: 12px;
    padding: 14px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button.ghost { font: inherit; font-weight: 600; border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 16px; background: var(--card); color: var(--ink); cursor: pointer; }
  button:disabled { opacity: .5; }

  /* progress */
  .count { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 10px; }
  .count b { font-size: 44px; font-weight: 650; letter-spacing: -1.5px; line-height: 1; }
  .count span { color: var(--muted); font-size: 18px; }
  .bar { height: 8px; border-radius: 8px; background: var(--plain-bg); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 8px; transition: width .3s; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 8px; text-align: right; min-height: 18px; }
  .sync { font-weight: 600; }
  .sync.saved { color: var(--ok); } .sync.saving { color: var(--muted); } .sync.stuck { color: var(--warn); }
  .listinfo { text-align: right; font-size: 12px; margin-top: 8px; }
  .link { border: 0; background: none; padding: 0; font: inherit; color: var(--muted); text-decoration: underline; cursor: pointer; }
  .reauth { background: var(--warn-bg); border-color: transparent; font-size: 14px; display: grid; gap: 10px; }
  .done { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-weight: 600; }

  /* scanner */
  .viewport { position: relative; border-radius: 12px; overflow: hidden; background: #000; margin-bottom: 12px; }
  #reader video { display: block; width: 100%; }
  .flash { position: absolute; inset: 0; pointer-events: none; border: 4px solid transparent; border-radius: 12px; transition: border-color .15s; }
  .flash.ok { border-color: var(--ok); } .flash.warn { border-color: var(--warn); } .flash.bad { border-color: var(--bad); } .flash.dup { border-color: #9aa39e; }
  .toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); max-width: 86%;
    padding: 12px 18px; border-radius: 14px; color: #fff; font-weight: 700; font-size: 18px; line-height: 1.25; text-align: center;
    box-shadow: 0 6px 24px #0006; opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s; }
  .toast small { display: block; font-weight: 500; font-size: 13px; opacity: .9; margin-top: 2px; }
  .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .toast.ok { background: #2f8a55; } .toast.warn { background: #c27c12; } .toast.bad { background: #b8392e; } .toast.dup { background: #5d6762; }
  .result.dup .t { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .toast, .flash { transition: none; } }

  /* last result */
  .result { border-radius: 12px; padding: 12px 14px; background: var(--plain-bg); margin-top: 12px; }
  .result .t { font-weight: 650; }
  .result .s { font-size: 14px; color: var(--muted); }
  .result.ok { background: var(--ok-bg); } .result.ok .t { color: var(--ok); }
  .result.warn { background: var(--warn-bg); } .result.warn .t { color: var(--warn); }
  .result.bad { background: var(--bad-bg); } .result.bad .t { color: var(--bad); }

  .manual { display: flex; gap: 8px; margin-top: 12px; }
  .manual input { flex: 1; }

  /* missing list */
  h2 { font-size: 14px; font-weight: 650; margin: 0 0 8px; }
  h2 span { color: var(--muted); font-weight: 500; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  li:first-child { border-top: 0; }
  li code { font: 13px ui-monospace, Menlo, monospace; color: var(--muted); min-width: 76px; }
  li .tick { margin-left: auto; width: 18px; text-align: center; }
  li.got { color: var(--ok); } li.got code { color: var(--ok); }
  .empty { font-size: 14px; color: var(--muted); }

  .center { text-align: center; padding: 28px 16px; }
  .center p { color: var(--muted); margin: 6px 0 20px; }
  #gbtn { display: flex; justify-content: center; min-height: 44px; }
  .err { color: var(--bad); font-size: 14px; margin-top: 12px; }
  .loading { opacity: .55; transition: opacity .2s; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Book Check</h1>
    <div class="who" id="who" hidden><span id="email"></span><button id="signout">Sign out</button></div>
  </header>

  <!-- Sign-in -->
  <section id="signin" class="card center">
    <h2 style="font-size:18px">Sign in to start</h2>
    <p>Use your @sjps.edu.hk account.</p>
    <div id="gbtn"></div>
    <div class="err" id="signin-err" hidden></div>
  </section>

  <!-- App -->
  <section id="app" hidden>
    <div class="card reauth" id="reauth" hidden>
      <div><b>Sign-in expired.</b> Your scans are kept on this phone — sign in to save them.</div>
      <div id="gbtn2"></div>
    </div>

    <div class="card">
      <label class="small" for="cls">Class</label>
      <select id="cls"><option value="">Loading…</option></select>
      <div class="listinfo"><button class="link" id="reload" type="button">Reload list</button></div>
    </div>

    <div class="card" id="progress" hidden>
      <div class="count"><b id="found">0</b><span>/ <span id="total">0</span> found</span></div>
      <div class="bar"><i id="barfill"></i></div>
      <div class="meta"><span class="sync" id="sync"></span></div>
      <div class="done" id="done" hidden>✓ All books found</div>
    </div>

    <div class="card" id="scanbox" hidden>
      <div class="viewport" id="viewport" hidden><div id="reader"></div><div class="flash" id="flash"></div><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
      <button class="primary" id="toggle">Start scanning</button>
      <div class="result" id="result" hidden><div class="t" id="rt"></div><div class="s" id="rs"></div></div>
      <form class="manual" id="manual" autocomplete="off">
        <input id="manual-id" placeholder="Type a BookID" autocapitalize="none" spellcheck="false">
        <button class="ghost" type="submit">Add</button>
      </form>
    </div>

    <div class="card" id="listbox" hidden>
      <h2>Book list</h2>
      <ul id="booklist"></ul>
    </div>
    <div class="err" id="app-err" hidden></div>
  </section>
</main>

<script>
/* ===== Settings: fill these in ===== */
const CONFIG = {
  CLIENT_ID: '50487504605-rg8pk326ajj8d8j5lckfihn5n9gbevq4.apps.googleusercontent.com',
  API_URL: 'https://script.google.com/macros/s/AKfycbyy87_E6TWyt_4S6tTo4ZGtqR62usHOXEL1eA_O7QLsqU9zqRzHP73OnVtFotP7vXp8RQ/exec',
  DOMAIN: 'sjps.edu.hk',
};

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
  getLocal(k) { try { return localStorage.getItem(k); } catch { return null; } },
  setLocal(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Sign-in ---------- */
let token = null;

function jwtPayload(t) {
  try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); } catch { return null; }
}
function tokenValid(t) {
  const p = t && jwtPayload(t);
  return p && p.exp * 1000 > Date.now() + 60000 && p.hd === CONFIG.DOMAIN;
}

function onCredential(resp) {
  const p = jwtPayload(resp.credential);
  if (!p || p.hd !== CONFIG.DOMAIN) { showSignin('Please use your @' + CONFIG.DOMAIN + ' account.'); return; }
  token = resp.credential;
  store.set('token', token);
  if (data) { $('reauth').hidden = true; flush(); }   // already working: just carry on saving
  else enterApp(p.email);
}

function showSignin(msg) {
  token = null; store.del('token');
  stopCamera();
  $('app').hidden = true; $('who').hidden = true; $('signin').hidden = false;
  $('signin-err').hidden = !msg; $('signin-err').textContent = msg || '';
}

// Sign-in ran out while working: keep scanning, ask to sign in again to save.
function needSignin(msg) {
  token = null; store.del('token');
  if (!data) { showSignin(msg); return; }
  $('reauth').hidden = false;
  try { google.accounts.id.renderButton($('gbtn2'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 240 }); google.accounts.id.prompt(); } catch {}
}

function initGoogle() {
  if (!window.google || !google.accounts) { setTimeout(initGoogle, 100); return; }
  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID, callback: onCredential, hd: CONFIG.DOMAIN,
    auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true,
  });
  google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 260 });
  const saved = store.get('token');
  if (tokenValid(saved)) { token = saved; enterApp(jwtPayload(saved).email); }
  else google.accounts.id.prompt();
}

$('signout').onclick = () => {
  if (outbox.length && !confirm(`${outbox.length} scan(s) are not saved yet. Sign out anyway? They stay on this phone and are saved next time.`)) return;
  if (window.google) google.accounts.id.disableAutoSelect();
  data = null;
  showSignin();
};

/* ---------- API ---------- */
async function api(action, body = {}) {
  if (!tokenValid(token)) { needSignin('Your sign-in expired. Please sign in again.'); throw new Error('auth'); }
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
    body: JSON.stringify(Object.assign({ action, token }, body)),
  });
  const text = await res.text();
  let out;
  try { out = JSON.parse(text); }
  catch { throw new Error('Server said: ' + (new DOMParser().parseFromString(text, 'text/html').body.textContent || text).replace(/\s+/g, ' ').trim().slice(0, 200)); }
  if (out.auth === false) { needSignin(out.error); throw new Error('auth'); }
  if (!out.ok) throw new Error(out.error || 'Something went wrong.');
  return out;
}

function appError(msg) { $('app-err').hidden = !msg; $('app-err').textContent = msg || ''; }

/* ---------- Book list: loaded once, then everything happens on the phone ---------- */
let data = null;          // { year, classes, books: Map(id -> { name, cls, lost, found }), loadedAt }
let currentCls = '';

function useData(out, loadedAt) {
  const books = new Map();
  out.books.forEach(b => books.set(b.id, { name: b.name, cls: b.cls, lost: !!b.lost, found: !!b.found }));
  data = { year: out.year, classes: out.classes, books, loadedAt };
  outbox.forEach(sc => { const b = books.get(sc.id); if (b) b.found = true; }); // unsaved scans still count
  const last = currentCls || store.getLocal('cls');
  $('cls').innerHTML = '<option value="">Choose a class</option>' +
    data.classes.map(c => `<option${c === last ? ' selected' : ''}>${esc(c)}</option>`).join('');
  selectClass(last && data.classes.includes(last) ? last : '');
}

async function loadList() {
  $('reload').textContent = 'Loading…';
  try {
    const out = await api('init');
    store.setLocal('bookData', JSON.stringify({ out, at: Date.now() }));
    useData(out, Date.now());
    appError();
    $('reload').textContent = 'Reload list';
  } catch (e) {
    $('reload').textContent = 'Reload list';
    if (e.message === 'auth') return;
    let cached = null;
    try { cached = JSON.parse(store.getLocal('bookData') || 'null'); } catch {}
    if (cached) { useData(cached.out, cached.at); appError('No connection — using the book list saved on this phone. Scans will be saved when the connection is back.'); }
    else appError('Could not load the book list. ' + e.message);
  }
}

function enterApp(email) {
  $('signin').hidden = true; $('app').hidden = false;
  $('email').textContent = email; $('who').hidden = false;
  loadList();
  flush();
}

$('cls').onchange = () => selectClass($('cls').value);
$('reload').onclick = () => { flush(); loadList(); };

function selectClass(cls) {
  currentCls = cls;
  store.setLocal('cls', cls);
  $('result').hidden = true;
  const show = !!cls;
  $('progress').hidden = $('scanbox').hidden = $('listbox').hidden = !show;
  if (!show) { stopCamera(); return; }
  draw();
}

function draw() {
  if (!data || !currentCls) return;
  const list = [...data.books].filter(([, b]) => b.cls === currentCls && !b.lost); // Lost books are not expected
  const missing = list.filter(([, b]) => !b.found);
  const found = list.length - missing.length;
  $('found').textContent = found;
  $('total').textContent = list.length;
  $('barfill').style.width = list.length ? (found / list.length * 100) + '%' : '0';
  $('done').hidden = !(list.length > 0 && missing.length === 0);
  $('booklist').innerHTML = list.length
    ? list.map(([id, b]) => `<li${b.found ? ' class="got"' : ''}><code>${esc(id)}</code><span>${esc(b.name)}</span><span class="tick">${b.found ? '✓' : ''}</span></li>`).join('')
    : '<li class="empty">No books in this class.</li>';
  drawSync();
}

/* ---------- Feedback (sound + colour; iPhone has no web vibration) ---------- */
let audio;
function beep(kind) {
  if (!audio) return;
  const tones = { ok: [880], warn: [520, 520], bad: [220], dup: [640] }[kind];
  if (!tones) return;
  tones.forEach((f, i) => {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.16;
    o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.start(t); o.stop(t + 0.13);
  });
  if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 60 : [60, 60, 60]);
}

const FEEDBACK_MS = 500; // how long the message stays on the camera view
let flashTimer;
function showResult(kind, title, sub, toast) {
  $('result').className = 'result ' + kind;
  $('rt').textContent = title; $('rs').textContent = sub || '';
  $('result').hidden = false;
  $('flash').className = 'flash ' + kind;
  const t = $('toast');
  t.className = 'toast show ' + kind;
  t.innerHTML = esc(toast ? toast[0] : title) + (toast && toast[1] ? `<small>${esc(toast[1])}</small>` : '');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { $('flash').className = 'flash'; t.className = 'toast ' + kind; }, FEEDBACK_MS);
  beep(kind);
}

/* ---------- Scanning (all on the phone) ---------- */
const recent = new Map(); // code -> time, to ignore the same label held in view

function onCode(raw) {
  const code = String(raw).trim().toLowerCase();
  if (!code || !currentCls || !data) return;
  const now = Date.now();
  if (now - (recent.get(code) || 0) < 4000) return;
  recent.set(code, now);

  const b = data.books.get(code);
  if (!b) { showResult('bad', 'Not in the book list', code + ' — if it was just added, tap “Reload list”.', ['✗ Not in list', code]); return; }
  if (b.cls !== currentCls) {   // only books of the chosen class are recorded
    showResult('warn', `Wrong class — this book belongs to ${b.cls}`, `${code} · ${b.name} — not recorded`, ['Wrong class', 'Belongs to ' + b.cls]);
    return;
  }
  if (b.found) { showResult('dup', 'Already checked', `${code} · ${b.name}`, ['Already checked', b.name]); return; }
  b.found = true;
  addToOutbox({ id: code, cls: currentCls, t: now });
  showResult('ok', '✓ ' + (b.name || code), code, ['✓ ' + (b.name || code)]);
  draw();
}

/* ---------- Saving: outbox kept on the phone, sent to the Sheet in batches ---------- */
let outbox = [];
try { outbox = JSON.parse(localStorage.getItem('outbox') || '[]'); } catch {}
const saveOutbox = () => { try { localStorage.setItem('outbox', JSON.stringify(outbox)); } catch {} };

let flushTimer, sending = false, retryMs = 0;

function addToOutbox(sc) {
  outbox.push(sc); saveOutbox();
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 1500); // gather scans for a moment, then send together
}

async function flush() {
  clearTimeout(flushTimer);
  if (sending || !outbox.length) { drawSync(); return; }
  sending = true; drawSync();
  const batch = outbox.slice(0, 200);
  try {
    const out = await api('sync', { scans: batch });
    outbox = outbox.filter(sc => !batch.includes(sc)); saveOutbox();
    retryMs = 0;
    if (data) {
      const foundSet = new Set(out.foundIds);
      data.books.forEach((b, id) => { if (foundSet.has(id)) b.found = true; }); // picks up other teachers' scans too
    }
    appError();
  } catch (e) {
    if (e.message !== 'auth') retryMs = Math.min(30000, (retryMs || 2000) * 2); // back off: 4s, 8s, 16s, 30s
  } finally {
    sending = false;
    if (outbox.length && token && $('reauth').hidden) flushTimer = setTimeout(flush, retryMs || 300);
    draw(); drawSync();
  }
}

function drawSync() {
  const el = $('sync');
  if (!el) return;
  if (!outbox.length) { el.className = 'sync saved'; el.textContent = '✓ All saved'; return; }
  el.className = 'sync ' + (retryMs || !token ? 'stuck' : 'saving');
  el.textContent = retryMs || !token ? `${outbox.length} not saved yet — retrying` : `Saving ${outbox.length}…`;
}

window.addEventListener('online', () => { retryMs = 0; flush(); });

// Leaving the page: try to send what's left right away. If that fails it stays on the phone and is sent next time.
function sendBeaconNow() {
  if (!outbox.length || !tokenValid(token) || !navigator.sendBeacon) return;
  try {
    navigator.sendBeacon(CONFIG.API_URL, new Blob([JSON.stringify({ action: 'sync', token, scans: outbox.slice(0, 200) })], { type: 'text/plain;charset=utf-8' }));
  } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') sendBeaconNow(); else flush(); });
window.addEventListener('beforeunload', e => { if (outbox.length) { sendBeaconNow(); e.preventDefault(); e.returnValue = ''; } });

let scanner, running = false, wakeLock = null;

async function startCamera() {
  if (!window.Html5Qrcode) { appError('Scanner could not load. Please reload the page.'); return; }
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {}
  $('toggle').disabled = true;
  $('viewport').hidden = false;
  try {
    const F = Html5QrcodeSupportedFormats;
    scanner = scanner || new Html5Qrcode('reader', {
      verbose: false, formatsToSupport: [F.CODE_128, F.CODE_39, F.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    });
    await scanner.start({ facingMode: 'environment' }, {
      fps: 12,
      qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h * 0.6, w * 0.45)) }),
    }, onCode);
    running = true;
    $('toggle').textContent = 'Stop scanning';
    try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  } catch (e) {
    $('viewport').hidden = true;
    const m = String(e?.message || e);
    appError(/NotAllowed|denied|permission/i.test(m)
      ? 'Camera permission was blocked. In Settings › Safari › Camera, choose Allow, then reload.'
      : 'Could not start camera. ' + m);
  } finally { $('toggle').disabled = false; }
}

async function stopCamera() {
  if (!running) return;
  running = false;
  try { await scanner.stop(); } catch {}
  try { wakeLock?.release(); } catch {}
  $('viewport').hidden = true;
  $('toggle').textContent = 'Start scanning';
}

$('toggle').onclick = () => running ? stopCamera() : startCamera();

$('manual').onsubmit = e => {
  e.preventDefault();
  const v = $('manual-id').value;
  if (!v.trim()) return;
  recent.delete(v.trim().toLowerCase());
  onCode(v);
  $('manual-id').value = '';
};

window.addEventListener('pagehide', () => { if (running) scanner.stop().catch(() => {}); });
initGoogle();
</script>
</body>
</html>
